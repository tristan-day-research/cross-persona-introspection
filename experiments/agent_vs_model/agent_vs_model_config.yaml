    mappings: assigned
    n_families: 8
    seed: 20261013
    temperature: 0.0
    batch_size: 1
    model_dtype: bfloat16
    bootstrap_iterations: 2000

  # ── Door code in the SYSTEM prompt (code_location: system; configs end in _syscode) ──────
  # Same wording as the default layout; the scenario record (which holds the door code) moves
  # from the user message to the system message. The user message keeps the assistant
